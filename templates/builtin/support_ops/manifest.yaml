name: support_ops
version: "1.0.0"
description: >-
  Customer support triage and response — classifies tickets by severity and
  sentiment, drafts a reply, escalates high-severity or churn-risk cases.
domain: support_ops
author: ForgeFlow
homepage: https://github.com/JoelJohnsonThomas/ForgeFlow
license: Apache-2.0
tags:
  - support
  - ticket-triage
  - sla
stages:
  - triage
  - investigate
  - respond
  - escalate
  - resolve
input_schema:
  ticket_id: { type: string, required: true }
  customer_name: { type: string, required: true }
  subject: { type: string, required: true }
  body: { type: string, required: true }
  channel: { type: string, required: false, enum: [email, chat, phone, portal, social] }
  product: { type: string, required: false }
  customer_tier: { type: string, required: false }
  previous_ticket_count: { type: integer, required: false }
requires_connectors: []
# Optional connectors:
#   - jira          # ticket creation in Jira
#   - servicenow    # incident management
#   - slack         # escalation notifications
requires_extras: []
