apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "forgeflow.configName" . }}
  labels:
    {{- include "forgeflow.labels" . | nindent 4 }}
data:
  LLM_PROVIDER: {{ .Values.config.llmProvider | quote }}
  OPENAI_MODEL: {{ .Values.config.openaiModel | quote }}
  OPENAI_MODEL_STRONG: {{ .Values.config.openaiModelStrong | quote }}

  POSTGRES_URL: {{ .Values.config.postgresUrl | quote }}
  POSTGRES_SYNC_URL: {{ .Values.config.postgresSyncUrl | quote }}

  MCP_SERVER_HOST: "0.0.0.0"
  MCP_SERVER_PORT: "8001"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"

  BUDGET_LIMIT_USD: {{ .Values.config.budgetLimitUsd | quote }}
  MAX_RETRIES: {{ .Values.config.maxRetries | quote }}
  CIRCUIT_BREAKER_THRESHOLD: {{ .Values.config.circuitBreakerThreshold | quote }}

  LANGCHAIN_TRACING_V2: {{ .Values.config.langchainTracingV2 | quote }}
  LANGCHAIN_PROJECT: {{ .Values.config.langchainProject | quote }}

  APPROVAL_ESCALATION_INTERVAL_SECONDS: {{ .Values.config.approval.intervalSeconds | quote }}
  APPROVAL_FIRST_ESCALATION_MINUTES: {{ .Values.config.approval.firstEscalationMinutes | quote }}
  APPROVAL_SECOND_ESCALATION_MINUTES: {{ .Values.config.approval.secondEscalationMinutes | quote }}
  APPROVAL_AUTO_REJECT_MINUTES: {{ .Values.config.approval.autoRejectMinutes | quote }}

  A2A_DISPATCH_ENABLED: {{ .Values.config.a2aDispatchEnabled | quote }}

  OTEL_ENABLED: {{ .Values.config.otel.enabled | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.otel.serviceName | quote }}
  OTEL_ENVIRONMENT: {{ .Values.config.otel.environment | quote }}
  OTEL_EXPORTER_ENDPOINT: {{ .Values.config.otel.exporterEndpoint | quote }}
  TRACING_PROVIDER: {{ .Values.config.tracingProvider | quote }}

  API_URL: "http://{{ .Release.Name }}-api:8000"
  API_PUBLIC_URL: {{ default (printf "http://%s-api:8000" .Release.Name) .Values.api.apiPublicUrl | quote }}
