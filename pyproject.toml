[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "forgeflow"
version = "0.1.0"
description = "Multi-Agent Enterprise Workflow Orchestrator — LangGraph + MCP + A2A"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["langgraph", "agents", "mcp", "a2a", "enterprise", "workflow"]

dependencies = [
    # LangGraph + LangChain core
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.28",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.0",
    # MCP
    "langchain-mcp-adapters>=0.1.0",
    "fastmcp>=2.0.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Dashboard
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    # Database
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "alembic>=1.14.0",
    # Validation + settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # HTTP
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    # Observability
    "langsmith>=0.2.11",
    # Resilience
    "tenacity>=9.0.0",
    # Token counting
    "tiktoken>=0.8.0",
    # Env
    "python-dotenv>=1.0.0",
    # Search
    "tavily-python>=0.5.0",
    # Utilities
    "python-multipart>=0.0.12",
    "pandas>=2.2.0",
    # Notifications
    "slack-sdk>=3.30.0",
    # Prometheus exposition
    "prometheus-client>=0.21.0",
    # JWT auth
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-beautifulsoup4",
    # TestRelic test-analytics reporter — uploads each pytest run to TestRelic.
    # Auto-registers via its pytest11 entry point; no-ops when the API key is unset.
    "testrelic-pytest>=0.6.4",
]
# Local-first / privacy mode — run against an Ollama daemon instead of OpenAI
ollama = [
    "langchain-ollama>=0.2.0",
]
# Anthropic Claude support (bonus provider alongside OpenAI)
anthropic = [
    "langchain-anthropic>=0.3.0",
]
# OpenTelemetry — exports to Phoenix, Langfuse, Jaeger, Tempo, Datadog APM, etc.
otel = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]
# Multi-modal — PDF text extraction + vision-LLM image description
multimodal = [
    "pypdf>=4.3.0",
]
# Redis Streams event consumer
events = [
    "redis>=5.0.0",
]
# Kafka event consumer
events-kafka = [
    "aiokafka>=0.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["forgeflow*", "dashboard*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = [
    "ANN401",  # Any disallowed — too broad for a dynamic system
    "ANN201",  # missing return type on public function — FastAPI uses response_model instead
    "ANN202",  # missing return type on private function
    "ANN002",  # missing type annotation for *args
    "ANN003",  # missing type annotation for **kwargs
    "B008",    # do not perform function calls in default arguments — required by FastAPI Depends()
    "E501",    # line too long — handled by formatter
    "SIM108",  # ternary operator — nested ternaries are sometimes clearer
    "SIM105",  # contextlib.suppress — try/except/pass with fallback return is clearer here
    "UP007",   # Optional[X] → X | None — Pydantic v2 accepts both; keep Optional for readability
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101"]
"scripts/**/*.py" = ["ANN"]
"dashboard/**/*.py" = ["ANN"]
"alembic/**/*.py" = ["ANN"]
# FastAPI route params injected via Depends() cannot carry full type annotations cleanly
"forgeflow/api/routers/**/*.py" = ["ANN001"]
# Late router import after app creation avoids circular-import edge cases
"forgeflow/api/main.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["forgeflow"]
omit = ["tests/*", "scripts/*"]
