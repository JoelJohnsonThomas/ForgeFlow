name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ----------------------------------------------------------------
  # Lint: ruff + mypy
  # ----------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linters
        run: pip install "ruff==0.15.13" mypy types-beautifulsoup4 pydantic pydantic-settings

      - name: ruff check
        run: ruff check forgeflow/ dashboard/ tests/ scripts/ --output-format=github

      - name: mypy
        run: mypy forgeflow/ --ignore-missing-imports --no-strict-optional

  # ----------------------------------------------------------------
  # Test: unit + integration with real Postgres (pgvector)
  # ----------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgeflow_test
          POSTGRES_USER: forgeflow
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_URL: postgresql+asyncpg://forgeflow:testpass@localhost:5432/forgeflow_test
      POSTGRES_SYNC_URL: postgresql+psycopg://forgeflow:testpass@localhost:5432/forgeflow_test
      # Use repo secret if available; fall back to a fake key so unit tests (which don't call the API) always pass
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_TEST || 'sk-test-fake-key-for-unit-tests' }}
      LANGCHAIN_TRACING_V2: "false"
      TAVILY_API_KEY: ""
      API_SECRET_KEY: "test-secret"
      BUDGET_LIMIT_USD: "10.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Alembic migrations
        run: alembic upgrade head
        env:
          POSTGRES_SYNC_URL: postgresql+psycopg://forgeflow:testpass@localhost:5432/forgeflow_test

      - name: Run tests
        run: pytest tests/unit tests/integration -v --cov=forgeflow --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ----------------------------------------------------------------
  # Build Docker images (main branch only)
  # ----------------------------------------------------------------
  build:
    name: Build Docker
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: api
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push MCP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: mcp
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: dashboard
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
