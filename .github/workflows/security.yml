name: Security

# Runs the full suite of static-analysis + supply-chain checks. Designed to
# fail PRs that introduce known-vulnerable code or dependencies. See
# SECURITY_AUDIT.md §9 for the rationale on each tool.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly so we catch newly-published CVEs against unchanged code.
    - cron: "0 6 * * *"

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------- #
  # Secret scanning
  # ---------------------------------------------------------------- #
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- #
  # Python SAST
  # ---------------------------------------------------------------- #
  bandit:
    name: bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install bandit[sarif]
      - name: bandit scan
        run: bandit -r forgeflow/ -ll -f sarif -o bandit.sarif
        continue-on-error: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit.sarif

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config p/security-audit --config p/owasp-top-ten --config p/python --config p/fastapi --config p/secrets --sarif --output semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ---------------------------------------------------------------- #
  # Dependency vulnerability scanning
  # ---------------------------------------------------------------- #
  pip-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --strict --disable-pip
        continue-on-error: false

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  npm-audit:
    name: npm audit (frontend deps)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------- #
  # IaC scanning
  # ---------------------------------------------------------------- #
  checkov:
    name: checkov (IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,kubernetes,dockerfile,github_actions
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif

  # ---------------------------------------------------------------- #
  # Container image scan + SBOM (runs on main only — needs an image)
  # ---------------------------------------------------------------- #
  trivy:
    name: trivy (container scan)
    if: github.ref == 'refs/heads/main'
    needs: []
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: api
          push: false
          tags: forgeflow/api:scan
          load: true
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: forgeflow/api:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

  sbom:
    name: SBOM (syft)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: forgeflow-sbom.spdx.json
