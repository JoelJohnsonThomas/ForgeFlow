apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgeflow
  namespace: forgeflow
  labels:
    app.kubernetes.io/name: forgeflow
  annotations:
    # NGINX Ingress example. Swap annotations for AWS ALB, GCP, Azure
    # Application Gateway, etc. as appropriate.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Streamlit WebSocket support
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # cert-manager — uncomment if installed
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts:
  #       - forgeflow.example.com
  #       - dashboard.forgeflow.example.com
  #     secretName: forgeflow-tls
  rules:
    - host: forgeflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgeflow-api
                port:
                  number: 8000
    - host: dashboard.forgeflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgeflow-dashboard
                port:
                  number: 8501
