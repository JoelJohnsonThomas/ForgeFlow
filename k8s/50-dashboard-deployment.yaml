apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeflow-dashboard
  namespace: forgeflow
  labels:
    app.kubernetes.io/name: forgeflow
    app.kubernetes.io/component: dashboard
spec:
  # Streamlit holds per-user session state in-process; running multiple
  # replicas requires sticky sessions at the Ingress layer. Stay at 1
  # until you've wired session affinity.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgeflow
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgeflow
        app.kubernetes.io/component: dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ghcr.io/joeljohnsonthomas/forgeflow/dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: API_URL
              value: http://forgeflow-api:8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
